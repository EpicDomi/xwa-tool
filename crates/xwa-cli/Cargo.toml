[package]
name = "xwa-cli"
description = "Command-line converter from Kiwix ZIM to offline wiki archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xwa-tool"
path = "src/main.rs"

[dependencies]
xwa-zim.workspace = true
xwa-format.workspace = true
xwa-convert.workspace = true
xwa-fetch.workspace = true
clap.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
