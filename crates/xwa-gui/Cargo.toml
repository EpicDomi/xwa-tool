[package]
name = "xwa-gui"
description = "Desktop app for converting Kiwix ZIM archives"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xwa-tool-gui"
path = "src/main.rs"

[dependencies]
xwa-zim.workspace = true
xwa-format.workspace = true
xwa-convert.workspace = true
xwa-fetch.workspace = true
xwa-flash.workspace = true
dirs.workspace = true
iced = { workspace = true, features = ["tokio", "canvas", "image-without-codecs"] }
image.workspace = true
ttf-parser.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd.workspace = true

[dev-dependencies]
iced_test = "0.14.0"
tempfile.workspace = true
