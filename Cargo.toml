[workspace]
resolver = "3"
members = ["crates/xwa-zim", "crates/xwa-format", "crates/xwa-convert", "crates/xwa-fetch", "crates/xwa-cli", "crates/xwa-gui", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/EpicDomi/xwa-tool"

[workspace.dependencies]
xwa-zim = { path = "crates/xwa-zim" }
xwa-format = { path = "crates/xwa-format" }
xwa-convert = { path = "crates/xwa-convert" }
xwa-fetch = { path = "crates/xwa-fetch" }
zstd = "0.14"
lzma-rs = "0.3"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
unicode-normalization = "0.1"
caseless = "0.2"
crc32c = "0.6"
libdeflater = "1.25"
iced = "0.14"
scraper = { version = "0.29", default-features = false }
ego-tree = "0.11"
rayon = "1.12"
percent-encoding = "2.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
jpeg-encoder = "0.7"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
katex-native = "0.1.1"
ttf-parser = "0.25"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
quick-xml = "0.42"
sha2 = "0.11"
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
dirs = "7"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
