# Every week: checks for a new Unicode version and new releases of the fonts
# the fallback font is drawn from, and when the data would change, opens an
# issue (or updates the open one) saying what changed, what Unicode assigns
# that no font draws, and whether the tests pass with the new data, so that
# new characters are noticed and the data brought in by hand
# (`cargo xtask unicode`, `cargo xtask fonts`, `cargo xtask fonts --rare`).
name: Unicode and fonts

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Unicode and fonts: new data"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the latest Unicode and fonts
        run: |
          cargo run -q -p xtask -- unicode
          cargo run -q -p xtask -- fonts
          cargo run -q -p xtask -- fonts --rare
      - name: Say what has no glyph
        run: cargo run -q -p xtask -- coverage --out coverage.md
      - name: Test
        id: test
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tail -40 > test.log
      - name: Report
        run: |
          if git diff --quiet -- crates/xwa-convert/data; then
            echo "Nothing changed."
            exit 0
          fi
          {
            cat coverage.md
            echo
            echo "## What changed"
            echo
            git diff --stat -- crates/xwa-convert/data | sed 's/^/    /'
            echo
            echo "To bring it in, run \`cargo xtask unicode\`, \`cargo xtask fonts\` and \`cargo xtask fonts --rare\` and commit \`crates/xwa-convert/data\`."
            echo
            if [ "${{ steps.test.outcome }}" = success ]; then
              echo "The tests pass with the new data."
            else
              echo "**The tests fail with the new data:**"
              echo
              echo '```'
              cat test.log
              echo '```'
            fi
            echo
            echo "_Checked $(date -u +%Y-%m-%d) by the weekly workflow._"
          } > body.md
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue edit "$open" --body-file body.md
            gh issue comment "$open" --body "Checked again on $(date -u +%Y-%m-%d); the description is up to date."
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
