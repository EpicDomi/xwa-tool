# Temporary: makes the catalogue of the fonts for rare characters where
# GitHub's releases can be reached, and prints it for committing. Removed
# before #37 merges.
name: Rare fonts catalogue (once)

on:
  push:
    branches: [claude/rare-characters]

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p xtask -- fonts --rare
      - run: |
          sha256sum crates/xwa-convert/data/fonts-rare.tsv.zst
          echo "BEGIN-CATALOGUE"
          base64 -w 0 crates/xwa-convert/data/fonts-rare.tsv.zst
          echo
          echo "END-CATALOGUE"
