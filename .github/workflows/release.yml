name: Release

on:
  push:
    tags: ["v*"]
  # A pull request that changes how releases are made builds them too; its
  # zips are kept as workflow artifacts instead of being published.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "rust-toolchain.toml"
      - "licenses/**"
      - "xtask/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            targets: x86_64-pc-windows-msvc
          - os: macos-latest
            name: macos-universal
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the compiler, and the first cargo command
      # installs it; the targets must be added to that toolchain.
      - name: Install Rust
        shell: bash
        run: |
          cargo --version
          rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Build (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          for bin in xwa-tool xwa-tool-gui; do
            lipo -create -output dist/$bin target/aarch64-apple-darwin/release/$bin target/x86_64-apple-darwin/release/$bin
          done
      - name: Build
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          ext=""; [ "${{ matrix.os }}" = "windows-latest" ] && ext=".exe"
          cp target/release/xwa-tool$ext target/release/xwa-tool-gui$ext dist/
      - name: Package
        shell: bash
        run: |
          cp -r LICENSE licenses dist/
          targets=""
          for t in ${{ matrix.targets }}; do targets="$targets --target $t"; done
          cargo xtask licenses $targets --out dist/THIRD-PARTY-LICENSES.txt
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then 7z a ../xwa-tool-${{ matrix.name }}.zip .; else zip -r ../xwa-tool-${{ matrix.name }}.zip .; fi
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: xwa-tool-${{ matrix.name }}.zip
      - name: Keep the zip
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: xwa-tool-${{ matrix.name }}
          path: xwa-tool-${{ matrix.name }}.zip
          retention-days: 7
